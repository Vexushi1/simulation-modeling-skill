name: Phase A repository checks

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-fixtures:
    name: Contracts and fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/lint_skill.py
      - run: python scripts/generate_indexes.py --check
      - run: python -m pytest -q
    # This job validates contracts and simulated evidence. Native MATLAB
    # qualification requires a separate fresh R2025b probe on the target host.
