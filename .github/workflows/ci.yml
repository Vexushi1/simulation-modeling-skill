name: H cache three-node diagnostic

'on':
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-fixtures:
    name: H cache diagnostic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/lint_skill.py
      - run: python scripts/generate_indexes.py --check
      - name: Diagnose only the three affected cache nodes
        run: >-
          python -m pytest -q --tb=short
          "tests/test_h_validation_reuse.py::test_actual_four_roles_and_three_baselines_reuse_with_fresh_whole_graph_and_independent_copies"
          "tests/test_h_validation_reuse.py::test_lawful_failed_study_and_H2_dispositions_hit_without_promotion[modify]"
          "tests/test_h_validation_reuse.py::test_lawful_failed_study_and_H2_dispositions_hit_without_promotion[reject]"
    # Temporary diagnostic under plan section 12.34; restore the original full
    # workflow before the final candidate. This is not a formal PR CI exit.
    # This job validates contracts and simulated evidence. Native MATLAB
    # qualification requires a separate fresh R2025b probe on the target host.
