schema_version: 1
version: 0.5.0
phase: E
runtime_evidence:
  producer: scripts/probe_environment.py
  consumer: scripts/validate_environment.py
  directory_policy: new_directory_per_invocation
  artefacts_from: core/runtime_assurance_contract.yaml#evidence_policy.artifacts
  receipt_from: core/runtime_assurance_contract.yaml#evidence_policy.receipt_filename
route_decision:
  producer: scripts/resolve_runtime.py
  output: json_stdout
  mutates_project_state: false
  business_execution_allowed: only simulation_execution after all E gates
project_state:
  schema: core/project_state.schema.yaml
  validator: scripts/validate_project_state.py
  writes: explicit_caller_only
  evidence_binding:
    environment:
    - profile_sha256
    - receipt_sha256
    problem:
    - sha256
    model:
    - sha256
    approval:
    - sha256
    mapping:
    - sha256
    implementation_environment:
    - profile_sha256
    - receipt_sha256
    protocol:
    - sha256
    primary_run:
    - sha256
    simulation_environment:
    - profile_sha256
    - receipt_sha256
  artefact_paths: inside_declared_project_root
  stale_propagation: transitive_dependents_of_changed_ids
  preserve_history: true
  validation_scopes:
    all: validate every implemented evidence role and current runtime requirements
    problem: validate problem identity and dependencies; environment, model and implementation readiness
      are unassessed; E readiness unassessed
    model: validate problem/model identity and dependencies; environment and implementation readiness
      are unassessed; E readiness unassessed
    implementation: validate B/C/D including historical model structure; current environment readiness
      is unassessed; E readiness unassessed
    simulation: validate B/C/D/E and historical run evidence; current environment readiness unassessed
problem_contract:
  schema: core/problem_contract.schema.yaml
  consumer: scripts/validate_problem_contract.py
  template: templates/contracts/problem_contract.yaml
  writer: caller performing the authorized audit; validator and resolver never write
  statuses:
  - draft
  - audited
  - frozen
  literal_offsets: Unicode codepoints; start inclusive and end exclusive
  original_and_text_identity: exact file SHA-256 values; reviewed extraction required for non-text statements
  semantic_digest_excludes:
  - status
  - freeze
  review_decision: independently byte-bound text and exact quote; cannot be manufactured by the validator
  freshness: source, contract and decision identities; runtime TTL does not expire unchanged problem meaning
  acceptance: current source and role/DAG/coverage checks; frozen additionally requires closed critical
    ambiguities and matching review decision
  claim_limit: mechanical completeness and traceability do not prove interpretation or real-system validity
model_contract:
  schema: core/model_contract.schema.yaml
  approval_contract: core/model_approval_contract.yaml
  consumer: scripts/validate_model_contract.py
  template: templates/contracts/model_contract.yaml
  brief_template: templates/contracts/model_approval_brief.md
  writer: explicit caller; validator and resolver never create approval or write state
  statuses:
  - draft
  - proposed
  - challenged
  - approved
  validation_results:
  - schema_valid
  - valid
  - proposal_complete
  - challenge_complete
  - ready_for_approval
  - approved
  prerequisite: current frozen Problem for proposed or later status and model_design route
  mathematical_identity: mathematical body only; no solver, validator, implementation, parameter values
    or approval
  semantic_digest_excludes:
  - status
  - approval
  brief_binding: exact current file SHA; Brief must not embed the semantic digest that includes its SHA
  approval_binding: independent current human decision, project, Problem SHA and semantic digest
  locked_model_spec: exact snapshot of current semantic content and digest; explicit caller creates it
    after actual approval
  freshness: current source, Problem, model, Brief, decision and locked bytes; independent of runtime
    TTL
  stale_limit: whole Problem binding is conservative; not the future fine-grained validation-data graph
  execution_allowed: false
  claim_limit: mechanical checks do not prove math, physics, review authenticity or real human approval
domain_mapping:
  schema: core/domain_mapping.schema.yaml
  consumer: scripts/validate_domain_mapping.py
  template: templates/contracts/domain_mapping.yaml
  module: modules/03_domain_mapping.md
  statuses:
  - draft
  - mapped
  - ready
  validation_results:
  - schema_valid
  - valid
  - mapping_complete
  - build_ready
  - built
  - structure_checked
  - implementation_ready
  prerequisite: current C human approval
  semantic_digest_excludes:
  - status
  - implementation
  writer: explicit caller; validator and resolver never write
  freshness: current C/parameters/sources/mapping/native files/producer identities; historical evidence
    retains its execution-time qualification
  claim_limit: structural trace/readback does not prove mathematical equivalence, physical validity or
    numerical correctness
parameter_provenance:
  schema: core/parameter_provenance.schema.yaml
  consumer: scripts/validate_parameter_provenance.py
  template: templates/contracts/parameter_provenance.yaml
  statuses:
  - draft
  - bound
  exact_binding: typed C design/model/variable value, unit, provenance and source references
  unknown_policy: preserve null; necessary native values block build readiness
  scope: explicit model-file workspace owner and distinct legal code_name
  estimation_execution: false
implementation_evidence:
  contract: core/implementation_assurance_contract.yaml
  producer: scripts/run_implementation.py
  qualification_producer: scripts/probe_implementation.py
  qualification_consumer: scripts/validate_implementation_profile.py
  directory_policy: new_directory_per_invocation
  profile_role: implementation_profile
  historical_roles:
  - implementation_model
  - structure_evidence
  execution_scope: implementation_execution
  business_execution_allowed: false
  simulation_execution_allowed: false
  acceptance: actual qualified create/connect/assign/update/save/close/reload/readback and complete input/source/runtime/SLX/receipt
    bindings
  freshness: current A and D profiles for new mutation; historical receipts checked against bound execution-time
    qualification
simulation_protocol:
  schema: core/simulation_protocol.schema.yaml
  consumer: scripts/validate_simulation_protocol.py
  template: templates/contracts/simulation_protocol.yaml
  statuses:
  - draft
  - frozen
  writer: explicit authorized caller after actual protocol review; never validator or router
  freshness: current B/C/D, protocol, scenario/input and review bytes; independent of runtime TTL
  claim_limit: frozen protocol grants no unqualified operation or numerical correctness claim
simulation_evidence:
  contract: core/simulation_assurance_contract.yaml
  producer: scripts/run_simulation.py
  qualification_producer: scripts/probe_simulation.py
  qualification_consumer: scripts/validate_simulation_profile.py
  receipt_consumer: scripts/validate_simulation_receipt.py
  directory_policy: new_directory_per_invocation
  execution_scope: simulation_execution
  state_writes: explicit caller only
  completion: actual process/raw/expected stop, finite complete outputs, metrics and diagnostics; never
    exit0 alone
  output_formats:
  - MAT_v7
  - JSON
  - CSV
  claim_limit: PRIMARY_RUN_COMPLETE is not NUMERICALLY_VERIFIED or VALIDATED
