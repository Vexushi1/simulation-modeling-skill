$schema: https://json-schema.org/draft/2020-12/schema
title: Phase H1 reviewed three-level numerical refinement evidence contract
type: object
additionalProperties: false
required: [schema_version, project_id, status, primary_protocol, refinement_protocols, method, comparison_times, outputs, obligations, budget, claim_limit, sources, settings_source_ref, review_record]
properties:
  schema_version: {const: 1}
  project_id: {$ref: '#/$defs/id'}
  status: {enum: [draft, reviewed]}
  primary_protocol: {$ref: '#/$defs/nullable_file'}
  refinement_protocols: {type: array, maxItems: 2, items: {$ref: '#/$defs/file'}}
  method: {enum: [null, ode4_step_refinement, ode45_tolerance_refinement]}
  comparison_times:
    anyOf:
      - {type: 'null'}
      - {type: array, minItems: 2, maxItems: 3001, items: {type: number}}
  outputs: {type: array, maxItems: 2, items: {$ref: '#/$defs/output'}}
  obligations:
    anyOf:
      - {type: 'null'}
      - type: object
        additionalProperties: false
        required: [residual, constraint, conservation, event_localization, numerical_drift]
        properties:
          residual: {$ref: '#/$defs/obligation'}
          constraint: {$ref: '#/$defs/obligation'}
          conservation: {$ref: '#/$defs/obligation'}
          event_localization: {$ref: '#/$defs/obligation'}
          numerical_drift: {$ref: '#/$defs/obligation'}
  budget:
    anyOf:
      - {type: 'null'}
      - {$ref: '#/$defs/budget'}
  claim_limit: {$ref: '#/$defs/text'}
  sources: {type: array, items: {$ref: '#/$defs/source'}}
  settings_source_ref:
    anyOf:
      - {type: 'null'}
      - {$ref: '#/$defs/source_ref'}
  review_record: {$ref: '#/$defs/nullable_file'}
$defs:
  id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'}
  text: {type: string, pattern: '\S'}
  sha: {type: string, pattern: '^[a-f0-9]{64}$'}
  file:
    type: object
    additionalProperties: false
    required: [path, sha256]
    properties:
      path: {$ref: '#/$defs/text'}
      sha256: {$ref: '#/$defs/sha'}
  nullable_file:
    anyOf:
      - {type: 'null'}
      - {$ref: '#/$defs/file'}
  source:
    type: object
    additionalProperties: false
    required: [id, path, sha256, purpose]
    properties:
      id: {$ref: '#/$defs/id'}
      path: {$ref: '#/$defs/text'}
      sha256: {$ref: '#/$defs/sha'}
      purpose: {$ref: '#/$defs/text'}
  source_ref:
    type: object
    additionalProperties: false
    required: [source_id, selector]
    properties:
      source_id: {$ref: '#/$defs/id'}
      selector:
        type: array
        items:
          oneOf:
            - {$ref: '#/$defs/text'}
            - {type: integer, minimum: 0}
  obligation:
    type: object
    additionalProperties: false
    required: [status, reason, source_ids]
    properties:
      status: {enum: [required, not_applicable, deferred]}
      reason: {$ref: '#/$defs/text'}
      source_ids: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/$defs/id'}}
  output:
    type: object
    additionalProperties: false
    required: [port, variable_id, unit, absolute_tolerance, relative_tolerance, contraction_limit, roundoff_floor]
    properties:
      port: {type: integer, minimum: 1}
      variable_id: {$ref: '#/$defs/id'}
      unit: {type: [string, 'null']}
      absolute_tolerance: {type: number, exclusiveMinimum: 0}
      relative_tolerance: {type: number, minimum: 0}
      contraction_limit: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1}
      roundoff_floor: {type: number, minimum: 0}
  budget:
    type: object
    additionalProperties: false
    required: [max_file_bytes, max_total_bytes, max_samples_per_output, max_result_bytes]
    properties:
      max_file_bytes: {type: integer, minimum: 1, maximum: 67108864}
      max_total_bytes: {type: integer, minimum: 1, maximum: 268435456}
      max_samples_per_output: {type: integer, minimum: 2, maximum: 12001}
      max_result_bytes: {type: integer, minimum: 1, maximum: 4194304}
  review_record:
    type: object
    additionalProperties: false
    required: [schema_version, project_id, verification_semantic_sha256, decision]
    properties:
      schema_version: {const: 1}
      project_id: {$ref: '#/$defs/id'}
      verification_semantic_sha256: {$ref: '#/$defs/sha'}
      decision:
        type: object
        additionalProperties: false
        required: [path, sha256, start, end, quote, reviewed_by, action]
        properties:
          path: {$ref: '#/$defs/text'}
          sha256: {$ref: '#/$defs/sha'}
          start: {type: integer, minimum: 0}
          end: {type: integer, minimum: 1}
          quote: {$ref: '#/$defs/text'}
          reviewed_by: {$ref: '#/$defs/text'}
          action: {const: review}
