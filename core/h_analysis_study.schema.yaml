$schema: https://json-schema.org/draft/2020-12/schema
title: Reviewed hypothetical Phase H analysis study; no adoption or approval
type: object
additionalProperties: false
required:
- schema_version
- project_id
- status
- base_protocol
- base_receipt
- primary_numerical_receipt
- factors
- method
- settings
- design
- metric
- numerical_policy
- inference
- criterion
- sources
- settings_source_ref
- budget
- claim_limit
- review_record
properties:
  schema_version:
    const: 1
  project_id:
    $ref: '#/$defs/id'
  status:
    enum:
    - draft
    - reviewed
  base_protocol:
    $ref: '#/$defs/nullable_file'
  base_receipt:
    $ref: '#/$defs/nullable_file'
  primary_numerical_receipt:
    $ref: '#/$defs/nullable_file'
  factors:
    type: array
    items:
      $ref: '#/$defs/factor'
    maxItems: 8
  method:
    oneOf:
    - type: 'null'
    - enum:
      - local_derivative
      - normalized_sensitivity
      - parameter_oat
      - morris
      - sobol
      - variance_based
      - prcc
      - independent_mc
      - gaussian_joint_mc
      - gaussian_copula_mc
      - initial_condition_catalog
      - initial_condition_grid
      - joint_stress_catalog
      - stress_grid
      - scenario_response
      - failure_boundary
      - runtime_comparison
  settings:
    oneOf:
    - type: 'null'
    - type: object
  design:
    oneOf:
    - type: 'null'
    - $ref: '#/$defs/design'
  metric:
    oneOf:
    - type: 'null'
    - $ref: '#/$defs/metric'
  numerical_policy:
    oneOf:
    - type: 'null'
    - $ref: '#/$defs/numeric_policy'
  inference:
    oneOf:
    - type: 'null'
    - type: object
  criterion:
    oneOf:
    - type: 'null'
    - $ref: '#/$defs/criterion'
  sources:
    type: array
    items:
      $ref: '#/$defs/source'
  settings_source_ref:
    $ref: '#/$defs/nullable_source_ref'
  budget:
    oneOf:
    - type: 'null'
    - $ref: '#/$defs/budget'
  claim_limit: &id002
    $ref: '#/$defs/text'
  review_record:
    $ref: '#/$defs/nullable_file'
$defs:
  id:
    type: string
    pattern: ^[A-Za-z][A-Za-z0-9_.-]*$
  text:
    type: string
    pattern: \S
  sha:
    type: string
    pattern: ^[a-f0-9]{64}$
  file:
    type: object
    additionalProperties: false
    required:
    - path
    - sha256
    properties:
      path:
        $ref: '#/$defs/text'
      sha256:
        $ref: '#/$defs/sha'
  nullable_file:
    oneOf:
    - type: 'null'
    - $ref: '#/$defs/file'
  source:
    type: object
    additionalProperties: false
    required:
    - id
    - path
    - sha256
    - purpose
    properties:
      id:
        $ref: '#/$defs/id'
      path:
        $ref: '#/$defs/text'
      sha256:
        $ref: '#/$defs/sha'
      purpose:
        $ref: '#/$defs/text'
  source_ref:
    type: object
    additionalProperties: false
    required:
    - source_id
    - selector
    properties:
      source_id:
        $ref: '#/$defs/id'
      selector:
        type: array
        items:
          oneOf:
          - type: string
            pattern: \S
          - type: integer
            minimum: 0
  nullable_source_ref:
    oneOf:
    - type: 'null'
    - $ref: '#/$defs/source_ref'
  review_record:
    type: object
    additionalProperties: false
    required:
    - schema_version
    - project_id
    - verification_semantic_sha256
    - decision
    properties:
      schema_version:
        const: 1
      project_id:
        $ref: '#/$defs/id'
      verification_semantic_sha256:
        $ref: '#/$defs/sha'
      decision:
        type: object
        additionalProperties: false
        required:
        - path
        - sha256
        - start
        - end
        - quote
        - reviewed_by
        - action
        properties:
          path:
            $ref: '#/$defs/text'
          sha256:
            $ref: '#/$defs/sha'
          start:
            type: integer
            minimum: 0
          end:
            type: integer
            minimum: 1
          quote:
            $ref: '#/$defs/text'
          reviewed_by:
            $ref: '#/$defs/text'
          action:
            const: review
  domain:
    type: object
    additionalProperties: false
    required:
    - lower
    - upper
    properties:
      lower: &id001
        type: number
      upper: *id001
  law:
    type: object
    additionalProperties: false
    required:
    - kind
    - parameters
    properties:
      kind:
        enum:
        - uniform
        - normal
      parameters:
        type: object
  locator:
    type: object
    additionalProperties: false
    required:
    - code_name
    - block_path
    - input_port
    - state_selector
    properties:
      code_name:
        oneOf:
        - type: 'null'
        - *id002
      block_path:
        oneOf:
        - type: 'null'
        - *id002
      input_port:
        oneOf:
        - type: 'null'
        - type: integer
          minimum: 1
      state_selector:
        oneOf:
        - type: 'null'
        - type: array
          items:
            oneOf:
            - type: string
            - type: integer
              minimum: 0
  waveform:
    type: object
    additionalProperties: false
    required:
    - time
    - baseline_values
    - mode
    properties:
      time:
        type: array
        items: *id001
        minItems: 2
        maxItems: 12001
      baseline_values:
        type: array
        items: *id001
        minItems: 2
        maxItems: 12001
      mode:
        enum:
        - constant
        - scale
        - offset
  factor:
    type: object
    additionalProperties: false
    required:
    - id
    - kind
    - variable_id
    - unit
    - baseline
    - domain
    - law
    - levels
    - probabilities
    - locator
    - waveform
    properties:
      id:
        $ref: '#/$defs/id'
      kind:
        enum:
        - parameter
        - initial_condition
        - external_input
      variable_id:
        $ref: '#/$defs/id'
      unit: *id002
      baseline: *id001
      domain:
        $ref: '#/$defs/domain'
      law:
        oneOf:
        - type: 'null'
        - $ref: '#/$defs/law'
      levels:
        type: array
        items: *id001
        maxItems: 16
      probabilities:
        oneOf:
        - type: 'null'
        - type: array
          items: *id001
          maxItems: 16
      locator:
        $ref: '#/$defs/locator'
      waveform:
        oneOf:
        - type: 'null'
        - $ref: '#/$defs/waveform'
  row:
    type: object
    additionalProperties: false
    required:
    - id
    - values
    - role
    - weight
    properties:
      id:
        $ref: '#/$defs/id'
      values:
        type: array
        items: *id001
        maxItems: 8
      role:
        type: object
      weight:
        oneOf:
        - type: 'null'
        - *id001
  design:
    type: object
    additionalProperties: false
    required:
    - schema_version
    - method
    - factor_ids
    - rows
    - metadata
    properties:
      schema_version:
        const: 1
      method: *id002
      factor_ids:
        type: array
        items:
          $ref: '#/$defs/id'
        maxItems: 8
      rows:
        type: array
        items:
          $ref: '#/$defs/row'
        maxItems: 2048
      metadata:
        type: object
  numeric_policy:
    type: object
    required:
    - method
    - scope
    - solver_levels
    - comparison_times
    - outputs
    - obligations
    - observables
    - checks
    - math_budget
    - budget
    - claim_limit
    properties:
      method:
        enum:
        - ode4_step_refinement
        - ode45_tolerance_refinement
        - ode15s_tolerance_refinement
      scope:
        enum:
        - actual_points
        - pwl_trajectory
      solver_levels:
        type: array
        items:
          type: object
        minItems: 3
        maxItems: 3
      comparison_times:
        oneOf:
        - type: 'null'
        - type: array
          items: *id001
          maxItems: 12001
      outputs:
        type: array
        items:
          type: object
        minItems: 1
      obligations:
        type: object
      observables:
        type: array
        items:
          type: object
      checks:
        type: array
        items:
          type: object
      math_budget:
        type: object
      budget:
        type: object
      claim_limit: *id002
      trajectory:
        type: object
      continuous_scope:
        type: object
      comparison_scope:
        type: string
    additionalProperties: false
  metric:
    type: object
    additionalProperties: false
    required:
    - statistic
    - unit
    - kind
    - output_port
    - variable_id
    - block_path
    - window
    - event
    - event_index
    - check
    properties:
      statistic:
        enum:
        - final
        - minimum
        - maximum
        - peak
        - peak_time
        - integral
        - absolute_integral
        - squared_integral
        - event_time
        - event_count
        - residual
        - constraint
        - conservation
        - drift
      unit: *id002
      kind:
        enum:
        - output
        - state
      output_port:
        oneOf:
        - type: 'null'
        - type: integer
          minimum: 1
      variable_id:
        oneOf:
        - type: 'null'
        - $ref: '#/$defs/id'
      block_path:
        oneOf:
        - type: 'null'
        - *id002
      window:
        oneOf:
        - type: 'null'
        - type: array
          items: *id001
          minItems: 2
          maxItems: 2
      event:
        oneOf:
        - type: 'null'
        - type: object
      event_index:
        oneOf:
        - type: 'null'
        - type: integer
          minimum: 0
      check:
        oneOf:
        - type: 'null'
        - type: object
  criterion:
    type: object
    additionalProperties: false
    required:
    - quantity
    - lower
    - upper
    - failure_disposition
    - reason
    - unit
    - result_selector
    properties:
      quantity:
        enum:
        - all_points
        - maximum
        - minimum
        - mean
        - event_probability
        - coverage_probability
        - boundary_width
        - runtime_ratio
        - analysis_defined
        - analysis_value
      lower:
        oneOf:
        - type: 'null'
        - *id001
      upper:
        oneOf:
        - type: 'null'
        - *id001
      failure_disposition:
        enum:
        - modify
        - reject
      reason: *id002
      unit: *id002
      result_selector:
        oneOf:
        - type: 'null'
        - type: array
          minItems: 1
          maxItems: 12
          items:
            oneOf:
            - type: string
              pattern: \S
            - type: integer
              minimum: 0
  budget:
    type: object
    additionalProperties: false
    required:
    - max_file_bytes
    - max_total_bytes
    - max_samples_per_output
    - max_result_bytes
    - max_groups
    - max_cases
    - process_timeout
    - simulation_timeout
    - total_timeout
    - max_iterations
    - max_factors
    - max_points
    - max_matrix_cells
    - max_bootstrap_replicates
    - max_work_items
    properties:
      max_file_bytes:
        type: integer
        minimum: 1
        maximum: 67108864
      max_total_bytes:
        type: integer
        minimum: 1
        maximum: 1073741824
      max_samples_per_output:
        type: integer
        minimum: 2
        maximum: 12001
      max_result_bytes:
        type: integer
        minimum: 1
        maximum: 16777216
      max_groups:
        type: integer
        minimum: 1
        maximum: 2048
      max_cases:
        type: integer
        minimum: 1
        maximum: 8192
      process_timeout:
        type: integer
        minimum: 1
        maximum: 3600
      simulation_timeout:
        type: integer
        minimum: 1
        maximum: 120
      total_timeout:
        type: integer
        minimum: 1
        maximum: 14400
      max_iterations:
        type: integer
        minimum: 1
        maximum: 2048
      max_factors:
        type: integer
        minimum: 1
        maximum: 8
      max_points:
        type: integer
        minimum: 1
        maximum: 2048
      max_matrix_cells:
        type: integer
        minimum: 1
        maximum: 65536
      max_bootstrap_replicates:
        type: integer
        minimum: 1
        maximum: 1000
      max_work_items:
        type: integer
        minimum: 1
        maximum: 2000000
