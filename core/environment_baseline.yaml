schema_version: 1
version: 0.1.1
baseline:
  matlab_release: R2025b
  matlab_version: "25.2"
  simulink_version: "25.2"
  primary_backend: Simulink
  primary_qualification_platform: Windows

core_required:
  - MATLAB
  - Simulink

candidate_products:
  - Control System Toolbox
  - Optimization Toolbox
  - Global Optimization Toolbox
  - Parallel Computing Toolbox
  - System Identification Toolbox
  - Symbolic Math Toolbox
  - Curve Fitting Toolbox
  - Robust Control Toolbox
  - Partial Differential Equation Toolbox
  - Model Predictive Control Toolbox
  - Model-Based Calibration Toolbox
  - Statistics and Machine Learning Toolbox
  - Simscape
  - Simscape Battery
  - Simscape Driveline
  - Simscape Electrical
  - Simscape Fluids
  - Simscape Multibody
  - Stateflow
  - System Composer
  - SimEvents
  - Simulink Control Design
  - Simulink Coverage
  - Simulink Design Optimization
  - Simulink Design Verifier
  - Simulink Fault Analyzer
  - Simulink Test
  - Simulink Check
  - Simulink Coder
  - Embedded Coder

capability_assurance_authority: core/runtime_assurance_contract.yaml
declaration_scope: target_and_candidates_only
routing_policy:
  - Select optional operations only when required by the current route.
  - Derive callable and qualified states from current operation evidence, never from this candidate list.
  - Report unavailable, failed, or stale capabilities with the contract-defined fallback.
