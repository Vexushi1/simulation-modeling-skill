schema_version: 1
phase: C
module_manifest: core/module_manifest.yaml
capability_taxonomy: core/capability_taxonomy.yaml
runtime_contract: core/runtime_assurance_contract.yaml
project_state_schema: core/project_state.schema.yaml
problem_contract_schema: core/problem_contract.schema.yaml
model_contract_schema: core/model_contract.schema.yaml
model_approval_contract: core/model_approval_contract.yaml

intents:
  inspect:
    phase: A
    mode: read_only
    module: environment_assurance
    profile_required: false
    execution_allowed: false
    required_gates: []
    expected_artefacts: []
    next_step: Run the repository probe in a new evidence directory when environment assurance is needed.
  assure_environment:
    phase: A
    mode: environment_only
    module: environment_assurance
    profile_required: true
    execution_allowed: true
    required_gates:
      - capability_profile_current
      - requested_operations_qualified
      - project_state_valid_if_supplied
    expected_artefacts:
      - capability_profile
      - runtime_receipt
      - raw_probe_report
      - process_log
    next_step: Record the validated profile in project state through a separate explicit state update.
  problem_audit:
    phase: B
    mode: read_only
    module: problem_audit
    profile_required: false
    execution_allowed: false
    state_validation_scope: problem
    required_gates:
      - problem_sources_current_if_supplied
      - problem_contract_valid_if_supplied
      - problem_state_valid_if_supplied
    expected_artefacts:
      - problem_contract_draft
      - literal_audit
      - requirement_map
      - problem_audit_report
    next_step: Prepare or review the source-bound problem contract; record a freeze review separately and update project state only through an explicit caller action.
  model_design:
    phase: C
    mode: read_only
    module: model_design
    profile_required: false
    execution_allowed: false
    state_validation_scope: model
    required_gates:
      - problem_contract_frozen
      - model_sources_current_if_supplied
      - model_contract_valid_if_supplied
      - model_state_valid_if_supplied
    expected_artefacts:
      - model_contract_draft
      - model_challenge_review
      - model_approval_brief
    next_step: Develop and challenge the mathematical model, preserve unknown parameters and proposed checks, then request a human decision on the current brief; no implementation or numerical execution is authorized.

operation_selection:
  defaults_from: module_manifest.modules.environment_assurance.required_operations
  optional_policy: explicit_request_only
  selected_scope: route_decision_only
  mutate_profile: false

future_capabilities:
  status: deferred
  execution_allowed: false
  activate_modules: false
  activate_packs: false
  activate_upstream_skills: false
  common_missing_gates:
    - requested_capability_implemented
  prerequisite_gates_by_phase:
    C: [problem_contract_frozen]
    D: [model_design_approved]
    E: [model_structure_checked, simulation_protocol_approved]
    F: [simulation_protocol_approved, calibration_data_roles_approved]
    G: [simulation_protocol_approved, experiment_design_approved]
    H: [accepted_simulation_evidence]
    I: [accepted_verification_evidence, validation_target_approved]
    J: [accepted_claim_evidence, evidence_package_valid]
  next_step_template: Complete the implementation and reviewed exit gates for Phase {phase}; the current Phase A/B/C router grants no business execution permission.

fallback:
  missing_or_stale_profile:
    action: reprobe_current_environment
    command: python scripts/probe_environment.py --matlab-executable <R2025b-executable> --output-dir <new-evidence-directory>
    reason: Environment evidence must come from the current repository probe and be bound to its receipt.
  optional_operation_unavailable:
    action: repair_or_review_optional_requirement
    reason: Repair and re-probe the requested operation, or explicitly review whether the task can omit it without changing the mathematical method.
  invalid_project_state:
    action: repair_project_state
    reason: Repair invalid or stale state evidence before requesting execution; the resolver never rewrites project state.
  future_capability:
    action: implement_next_phase
    reason: Review the full implementation plan and complete the declared phase; no unimplemented module or upstream skill is activated.
  problem_contract_invalid:
    action: review_problem_sources_and_contract
    reason: Re-read the original material, repair its exact source bindings and requirement audit, and preserve unresolved information. Do not substitute a numerical method or generate a freeze decision.
  model_contract_invalid:
    action: review_model_sources_and_design
    reason: Re-read the frozen problem and design sources, repair the mathematical design and exact bindings, and preserve pending or blocked reviews. Do not generate a human approval or lock a model without an actual decision.

invariants:
  - inspect_never_grants_execution_or_advances_state
  - current_profile_and_requested_operations_required_for_environment_execution
  - environment_permission_does_not_grant_simulation_or_model_permission
  - optional_operations_are_explicit_and_do_not_change_profile
  - no_automatic_file_writes_or_state_transitions
  - no_mathematical_method_change_in_fallback
  - deferred_capabilities_activate_no_resources
  - unknown_intents_are_invalid
  - problem_audit_does_not_require_matlab_or_select_operations
  - problem_state_validation_is_partial_and_never_grants_environment_permission
  - problem_freeze_is_a_recorded_review_not_an_automatic_state_transition
  - model_design_requires_current_frozen_problem_without_runtime_permission
  - model_scope_does_not_assess_environment_and_problem_scope_does_not_assess_model
  - human_model_approval_is_never_generated_by_a_validator_or_resolver
  - model_approval_never_activates_deferred_implementation_or_execution
