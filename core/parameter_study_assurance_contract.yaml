  profile: parameter-study-profile.json
  profile_receipt: parameter-study-profile-receipt.json
  run_receipt: parameter-study-receipt.json
invariants:
- every selected method requires independent actual operation qualification
- actual process, MATLAB class, numeric readback, ledger, criteria and completion are separate checks
- no validator writes state, approved parameters, locked model, D implementation or E protocol
- all project results are candidate/trial and never primary, accepted, verified or adopted
- a failed simulation stops the study without fabricated penalties or replacement output
- new executions require current A/F and gain additionally same-runtime E ode4
- historical consumers use execution-time qualifications and current immutable bytes
deferred:
- fitlm parameter study
- nonlinear identification
- arbitrary expressions
- dynamic model calibration
- global optimization
- parallel execution
- multiobjective optimization
- SDO
- MBC
- candidate adoption
- numerical verification
- physical validation
