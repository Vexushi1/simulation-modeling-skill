schema_version: 1
phase: F
target:
  matlab_release: R2025b
  simulink_version: '25.2'
execution_channel: matlab_batch
validity_seconds: 86400
scope: source-bound finite serial candidate parameter studies; no adoption or primary evidence
operations:
  identification.arx_111:
    product: System Identification Toolbox
    license_feature: Identification_Toolbox
    functions:
    - iddata
    - arx
    - arxOptions
    cases:
    - arx_positive
    - arx_rank_deficient
    - arx_invalid_time
    - arx_holdout_rejected
    required_A_operations:
    - matlab.basic_execution
    - simulink.library_load
  calibration.simulink_gain:
    product: Optimization Toolbox
    license_feature: Optimization_Toolbox
    functions:
    - lsqnonlin
    - optimoptions
    - Simulink.SimulationInput
    - Simulink.SimulationData.Dataset
    - Simulink.Parameter
    - timeseries
    - sim
    - new_system
    - add_block
    - add_line
    - set_param
    - get_param
    - close_system
    - bdIsLoaded
    - Simulink.fileGenControl
    - save_system
    - load_system
    cases:
    - gain_positive
    - gain_simulation_error
    - gain_budget
    - gain_invalid_bounds
    required_A_operations:
    - matlab.basic_execution
    - simulink.library_load
  optimization.quadratic_sqp:
    product: Optimization Toolbox
    license_feature: Optimization_Toolbox
    functions:
    - fmincon
    - optimoptions
    cases:
    - quadratic_positive
    - quadratic_budget
    - quadratic_invalid_bounds
    required_A_operations:
    - matlab.basic_execution
    - simulink.library_load
