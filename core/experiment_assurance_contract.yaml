  campaign_ledger: campaign-ledger.json
  campaign_summary: campaign-summary.json
  run_receipt: experiment-receipt.json
invariants:
- current independent sample_plan qualification never supplies E simulation qualification
- only local mt19937ar and explicit uint32 seed control catalog sampling
- probabilities are not normalized and draws are not sorted, deduplicated or replaced
- actual input/output MAT arrays and JSON vectors preserve 0/1/N shapes
- every success and controlled failure preserves caller stream configuration and state
- every owned qualification override records restoration of the original global handle and configuration
- technical failures seal readable input, process, log and expected-output bytes in an invalid receipt
- new sampling requires current same-host runtime A/G; historical consumers assess execution-time TTL
- immutable source and artifact bytes remain required for historical consumers
- no sampler or validator modifies projects, models, approved parameters or state
deferred:
- continuous sampling
- lhsdesign
- normal sampling
- parameter overrides
- internal model randomness
- parsim
- parallel execution
- accelerated simulation
- GPU
- numerical verification
- physical validation
