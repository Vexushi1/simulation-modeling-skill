$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [schema_version, run_id, captured_at, valid_until, execution, runtime, input_identity, sources, operations, evidence]
properties:
  schema_version: {const: 1}
  run_id: {type: string, minLength: 1}
  captured_at: {type: string, minLength: 1}
  valid_until: {type: string, minLength: 1}
  execution:
    type: object
    additionalProperties: false
    required: [channel, fallback_reason, host_fingerprint, started_at, finished_at, process_state, exit_code]
    properties:
      channel: {const: matlab_batch}
      fallback_reason: {enum: [mcp_not_available, explicit_batch_probe]}
      host_fingerprint: {type: string, minLength: 1}
      started_at: {type: string, minLength: 1}
      finished_at: {type: string, minLength: 1}
      process_state: {enum: [completed, failed, timed_out]}
      exit_code: {type: [integer, 'null']}
  runtime:
    type: object
    additionalProperties: false
    required: [release, version, matlabroot, executable, platform, inventory_sha256, executable_sha256, version_file_sha256, function_files, fingerprint]
    properties:
      release: {type: string, minLength: 1}
      version: {type: string, minLength: 1}
      matlabroot: {type: string, minLength: 1}
      executable: {type: string, minLength: 1}
      platform: {type: string, minLength: 1}
      inventory_sha256: {$ref: '#/$defs/sha'}
      executable_sha256: {$ref: '#/$defs/sha'}
      version_file_sha256: {$ref: '#/$defs/sha'}
      function_files:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [path, sha256]
          properties:
            path: {type: string, minLength: 1}
            sha256: {$ref: '#/$defs/sha'}
      fingerprint: {$ref: '#/$defs/sha'}
  input_identity: {$ref: '#/$defs/sha'}
  sources:
    type: object
    minProperties: 6
    additionalProperties: {$ref: '#/$defs/sha'}
  operations:
    type: object
    minProperties: 2
    propertyNames:
      enum: [matlab.basic_execution, simulink.library_load, statistics.normcdf, statistics.fitlm, statistics.lhsdesign]
    additionalProperties:
      type: object
      additionalProperties: false
      required: [product, installed, licensed, resolvable, callable, qualified, scope, input_sha256]
      properties:
        product: {type: string, minLength: 1}
        installed: {type: boolean}
        licensed: {type: boolean}
        resolvable: {type: boolean}
        callable: {type: boolean}
        qualified: {type: boolean}
        scope: {type: string, minLength: 1}
        input_sha256: {$ref: '#/$defs/sha'}
  evidence:
    type: object
    additionalProperties: false
    required: [receipt_file, input_file, raw_file, log_file]
    properties:
      receipt_file: {const: receipt.json}
      input_file: {const: inputs.json}
      raw_file: {const: raw-probe.json}
      log_file: {const: matlab-batch.log}
$defs:
  sha: {type: string, pattern: '^[0-9a-f]{64}$'}
